      - name: Verify Layer 5 Hecke boundary
        run: |
          set -euo pipefail
          hecke_file=lean/Beal/Galois/05_Hecke.lean
          hecke_code=/tmp/layer5_hecke_code.lean

          # Remove Lean comments before checking the source itself. The boundary
          # documentation intentionally names excluded concepts, but those names
          # must not occur in executable declarations.
          python3 - "$hecke_file" > "$hecke_code" <<'PY'
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1]).read_text()
          output = []
          index = 0
          comment_depth = 0
          while index < len(source):
              if comment_depth:
                  if source.startswith("/-", index):
                      comment_depth += 1
                      output.extend("  ")
                      index += 2
                  elif source.startswith("-/", index):
                      comment_depth -= 1
                      output.extend("  ")
                      index += 2
                  else:
                      output.append("\n" if source[index] == "\n" else " ")
                      index += 1
              elif source.startswith("--", index):
                  while index < len(source) and source[index] != "\n":
                      output.append(" ")
                      index += 1
              elif source.startswith("/-", index):
                  comment_depth = 1
                  output.extend("  ")
                  index += 2
              else:
                  output.append(source[index])
                  index += 1
          print("".join(output), end="")
          PY

          if grep -nE '(^|[^[:alnum:]_])(axiom|sorryAx|sorry)([^[:alnum:]_]|$)' "$hecke_code"; then
            echo "FAIL: Layer 5 contains an axiom, sorry, or sorryAx declaration/reference"
            exit 1
          fi

          imports=$(grep -nE '^[[:space:]]*import[[:space:]]' "$hecke_code" || true)
          if ! printf '%s\n' "$imports" | grep -Fq \
              'import Beal.Galois.«03_ModLForm»'; then
            echo "FAIL: Layer 5 must import exactly Beal.Galois.«03_ModLForm»"
            exit 1
          fi
          unexpected_imports=$(printf '%s\n' "$imports" | grep -vF \
            'import Beal.Galois.«03_ModLForm»' || true)
          if [ -n "$unexpected_imports" ]; then
            echo "FAIL: Layer 5 has an import outside its audited boundary:"
            printf '%s\n' "$unexpected_imports"
            exit 1
          fi

          excluded_boundary='04_LevelLowering|06_MaximalIdeal|07_NewformSupport|08_RibetProof|B16_BealFinal|B17_MazurIrreducible|B18_FreyIsElliptic|B19_BealFinalAssembly|B20_BealConjectureDone|B21_FermatCorollary|level.?lowering|Ribet|Wiles|TateStep2|beal_(final|proof|conjecture)'
          if grep -nEi "$excluded_boundary" "$hecke_code"; then
            echo "FAIL: Layer 5 references an excluded level-lowering or final-proof boundary"
            exit 1
          fi

          cat > /tmp/layer5_hecke_axioms.lean <<'EOF'
          import Beal.Galois.«05_Hecke»
          #print axioms Beal.Galois.HeckeOp
          #print axioms Beal.Galois.HeckeOp_level_divides_conductor
          #print axioms Beal.Galois.DegeneracyMap
          #print axioms Beal.Galois.OldSubspace
          #print axioms Beal.Galois.IsNewform
          #print axioms Beal.Galois.HeckeSequenceOp
          #print axioms Beal.Galois.HeckeAlgebra
          #print axioms Beal.Galois.heckeSequenceOp_mem_HeckeAlgebra
          EOF
          lake --old env lean /tmp/layer5_hecke_axioms.lean \
            2>&1 | tee /tmp/layer5_hecke_axioms.txt

          declarations=(
            Beal.Galois.HeckeOp
            Beal.Galois.HeckeOp_level_divides_conductor
            Beal.Galois.DegeneracyMap
            Beal.Galois.OldSubspace
            Beal.Galois.IsNewform
            Beal.Galois.HeckeSequenceOp
            Beal.Galois.HeckeAlgebra
            Beal.Galois.heckeSequenceOp_mem_HeckeAlgebra
          )
          for declaration in "${declarations[@]}"; do
            if ! grep -Fq "'$declaration'" /tmp/layer5_hecke_axioms.txt; then
              echo "FAIL: missing Layer 5 axiom report for $declaration"
              exit 1
            fi
          done

          unexpected_axioms=$(grep -E "depends on axioms:" \
            /tmp/layer5_hecke_axioms.txt | grep -Ev \
            'depends on axioms: \[(propext(, Quot\.sound)?|Quot\.sound)\]' || true)
          if [ -n "$unexpected_axioms" ]; then
            echo "FAIL: Layer 5 declarations exceed the [propext, Quot.sound] axiom budget:"
            printf '%s\n' "$unexpected_axioms"
            exit 1
          fi
          if grep -E 'Classical\.choice|sorryAx' /tmp/layer5_hecke_axioms.txt; then
            echo "FAIL: Layer 5 axiom report contains a forbidden dependency"
            exit 1
          fi
          echo "OK: Layer 5 builds with lake --old, stays within its import boundary, and uses only propext/Quot.sound"

      - name: Verify Layer 6 maximal-ideal boundary
        run: |
          set -euo pipefail
          layer6_file=lean/Beal/Galois/06_MaximalIdeal.lean
          layer4_file=lean/Beal/Galois/04_LevelLowering.lean
          layer5_file=lean/Beal/Galois/05_Hecke.lean
          layer6_code=/tmp/layer6_maximalideal_code.lean

          # Remove Lean comments before checking the source itself. The boundary
          # documentation intentionally names excluded concepts, but those names
          # must not occur in executable declarations.
          python3 - "$layer6_file" > "$layer6_code" <<'PY'
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1]).read_text()
          output = []
          index = 0
          comment_depth = 0
          while index < len(source):
              if comment_depth:
                  if source.startswith("/-", index):
                      comment_depth += 1
                      output.extend("  ")
                      index += 2
                  elif source.startswith("-/", index):
                      comment_depth -= 1
                      output.extend("  ")
                      index += 2
                  else:
                      output.append("\n" if source[index] == "\n" else " ")
                      index += 1
              elif source.startswith("--", index):
                  while index < len(source) and source[index] != "\n":
                      output.append(" ")
                      index += 1
              elif source.startswith("/-", index):
                  comment_depth = 1
                  output.extend("  ")
                  index += 2
              else:
                  output.append(source[index])
                  index += 1
          print("".join(output), end="")
          PY

          if grep -nE '(^|[^[:alnum:]_])(axiom|opaque|sorryAx|sorry|admit)([^[:alnum:]_]|$)' \
              "$layer6_code"; then
            echo "FAIL: Layer 6 contains an axiom, opaque, sorry, sorryAx, or admit declaration/reference"
            exit 1
          fi

          imports=$(grep -E '^[[:space:]]*import[[:space:]]' "$layer6_code" || true)
          expected_imports=$'import Beal.Galois.«04_LevelLowering»\nimport Beal.Galois.«05_Hecke»'
          if [ "$imports" != "$expected_imports" ]; then
            echo "FAIL: Layer 6 imports changed outside its audited boundary:"
            printf '%s\n' "$imports"
            exit 1
          fi

          # Layers 4 and 5 are the only local dependencies of Layer 6. Keep
          # their import edges explicit too, so a final-proof or unrelated
          # boundary cannot enter Layer 6 transitively.
          layer4_imports=$(grep -E '^[[:space:]]*import[[:space:]]' "$layer4_file" || true)
          expected_layer4_imports=$'import Beal.Galois.«01_Absolute»\nimport Beal.Galois.«02_ResidualRep»\nimport Beal.Galois.«03_ModLForm»\nimport Beal.B14_FreyTate\nimport Beal.B03_Conductor_Core'
          if [ "$layer4_imports" != "$expected_layer4_imports" ]; then
            echo "FAIL: Layer 4 imports changed under the Layer 6 dependency boundary:"
            printf '%s\n' "$layer4_imports"
            exit 1
          fi
          layer5_imports=$(grep -E '^[[:space:]]*import[[:space:]]' "$layer5_file" || true)
          expected_layer5_imports='import Beal.Galois.«03_ModLForm»'
          if [ "$layer5_imports" != "$expected_layer5_imports" ]; then
            echo "FAIL: Layer 5 imports changed under the Layer 6 dependency boundary:"
            printf '%s\n' "$layer5_imports"
            exit 1
          fi

          # Imports are checked above, so exclude them from the reference scan.
          # This lets Layer 6 import the explicitly approved level-lowering
          # interface while rejecting references to downstream proof paths.
          implementation_code=/tmp/layer6_maximalideal_implementation.lean
          grep -vE '^[[:space:]]*import[[:space:]]' "$layer6_code" > "$implementation_code"
          excluded_boundary='07[b-k]_|07_NewformSupport|08_RibetProof|B15_|B16_|B17_|B18_|B19_|B20_|B21_|BSD|Birch|Swinnerton|Ribet|Wiles|TateStep2|beal_(final|proof|conjecture)|descent|level.?lowering'
          if grep -nEi "$excluded_boundary" "$implementation_code"; then
            echo "FAIL: Layer 6 references an excluded final-proof or unrelated boundary"
            exit 1
          fi

          cat > /tmp/layer6_maximalideal_axioms.lean <<'EOF'
          import Beal.Galois.«06_MaximalIdeal»
          #print axioms Beal.Galois.HeckeIdealLike
          #print axioms Beal.Galois.IsMaximalIdeal
          #print axioms Beal.Galois.MaximalIdeal
          #print axioms Beal.Galois.ResidueFieldData
          #print axioms Beal.Galois.ResidueFieldIsZMod
          #print axioms Beal.Galois.HeckeIdealLike.IsMaximal
          #print axioms Beal.Galois.FreyHeckeAttachment
          #print axioms Beal.Galois.MaximalIdealAttachedToRep
          #print axioms Beal.Galois.HeckeIdealAnnihilatesForm
          #print axioms Beal.Galois.IsSupportedInNewSubspace
          #print axioms Beal.Galois.frey_unramified_implies_maximalIdeal_support
          EOF
          lake --old env lean /tmp/layer6_maximalideal_axioms.lean \
            2>&1 | tee /tmp/layer6_maximalideal_axioms.txt

          declarations=(
            Beal.Galois.HeckeIdealLike
            Beal.Galois.IsMaximalIdeal
            Beal.Galois.MaximalIdeal
            Beal.Galois.ResidueFieldData
            Beal.Galois.ResidueFieldIsZMod
            Beal.Galois.HeckeIdealLike.IsMaximal
            Beal.Galois.FreyHeckeAttachment
            Beal.Galois.MaximalIdealAttachedToRep
            Beal.Galois.HeckeIdealAnnihilatesForm
            Beal.Galois.IsSupportedInNewSubspace
            Beal.Galois.frey_unramified_implies_maximalIdeal_support
          )
          for declaration in "${declarations[@]}"; do
            if ! grep -Fq "'$declaration'" /tmp/layer6_maximalideal_axioms.txt; then
              echo "FAIL: missing Layer 6 axiom report for $declaration"
              exit 1
            fi
          done

          unexpected_axioms=$(grep -E "depends on axioms:" \
            /tmp/layer6_maximalideal_axioms.txt | grep -Ev \
            'depends on axioms: \[(propext(, Quot\.sound)?|Quot\.sound)\]' || true)
          if [ -n "$unexpected_axioms" ]; then
            echo "FAIL: Layer 6 declarations exceed the [propext, Quot.sound] axiom budget:"
            printf '%s\n' "$unexpected_axioms"
            exit 1
          fi
          if grep -E 'Classical\.choice|sorryAx' /tmp/layer6_maximalideal_axioms.txt; then
            echo "FAIL: Layer 6 axiom report contains a forbidden dependency"
            exit 1
          fi
          echo "OK: Layer 6 builds with lake --old, stays within its dependency boundary, and uses only propext/Quot.sound"

      - name: Lake exe check
        run: lake exe cache get || true

  clean-build:
    name: Clean locked rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify the locked Lean toolchain is available
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(tr -d '[:space:]' < lean-toolchain)"
          if ! elan toolchain install "$toolchain"; then
            echo "::error title=Locked Lean toolchain unavailable::$toolchain from lean-toolchain could not be installed"
            echo "FAIL: locked Lean toolchain '$toolchain' is unavailable."
            echo "The release snapshot still requires the exact toolchain recorded in lean-toolchain."
            exit 1
          fi
          echo "OK: locked Lean toolchain '$toolchain' is available"

      - name: Rebuild from the committed dependency snapshot
        shell: bash
        run: |
          set -euo pipefail

          # This job intentionally does not restore .lake or use the normal
          # dependency cache. Lake must fetch the revisions in the committed
          # manifest, using the package declaration in lakefile.lean.
          rm -rf .lake
          if [ -e .lake ]; then
            echo "FAIL: generated .lake state could not be removed"
            exit 1
          fi

          build_log="$(mktemp)"
          trap 'rm -f "$build_log"' EXIT
          if ! lake build +Beal.B00_OperaNumerorum Beal 2>&1 | tee "$build_log"; then
            echo
            echo "FAIL: a clean checkout could not rebuild from the committed Lean and Lake dependency snapshot."
            echo "The build must work using lean-toolchain, lakefile.lean, and lake-manifest.json without leftover .lake state."
            echo "The first Lake error above identifies the affected locked dependency."
            echo "Do not repair this job by running 'lake update'."
            echo
            echo "Locked snapshot under test:"
            python3 - <<'PY'
          import json

          with open("lean-toolchain", encoding="utf-8") as toolchain_file:
              print(f"  Lean toolchain: {toolchain_file.read().strip()}")

          with open("lake-manifest.json", encoding="utf-8") as manifest_file:
              manifest = json.load(manifest_file)

          for package in manifest.get("packages", []):
              name = package.get("name", "<unnamed>")
              revision = package.get("rev", "<missing>")
              source = package.get("url", "<missing>")
              print(f"  Lake dependency: {name} @ {revision} ({source})")
          PY
            exit 1
          fi

          if ! git diff --quiet -- lakefile.lean lake-manifest.json; then
            echo "FAIL: the clean rebuild changed a committed Lake input."
            echo "A clean release build must consume the revisions already recorded in lake-manifest.json"
            echo "and the package declaration already recorded in lakefile.lean."
            echo
            git --no-pager diff -- lakefile.lean lake-manifest.json
            exit 1
          fi

          echo "OK: clean checkout rebuilt with the committed Lean toolchain and locked Lake dependencies"
