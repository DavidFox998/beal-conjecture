name: beal-conjecture CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly release-snapshot check, Monday at 06:17 UTC.
    - cron: "17 6 * * 1"

jobs:
  build:
    # Push and pull-request validation remains unchanged. Scheduled runs only
    # need the clean checkout below, which exercises the locked snapshot.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Restore Lean toolchain and Mathlib cache
        id: lean-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            ~/.elan/update-hashes
            .lake/packages
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Get Mathlib binary cache
        if: steps.lean-cache.outputs.cache-hit != 'true'
        run: lake exe cache get

      - name: Verify Opera Numerorum is in the release build
        run: |
          set -euo pipefail
          module='lean/Beal/B00_OperaNumerorum.lean'
          entrypoint='lean/Beal.lean'

          if [ ! -f "$module" ]; then
            echo "FAIL: $module is missing."
            echo "Restore the Opera Numerorum module before running the release build."
            exit 1
          fi

          if ! grep -qE '^[[:space:]]*import[[:space:]]+Beal\.B00_OperaNumerorum([[:space:]]|$)' "$entrypoint"; then
            echo "FAIL: $entrypoint does not import Beal.B00_OperaNumerorum."
            echo "Add 'import Beal.B00_OperaNumerorum' to $entrypoint so the release build includes the module."
            exit 1
          fi

          echo "OK: Opera Numerorum is present and imported by the release entrypoint"

      - name: Build all bricks
        run: lake build +Beal.B00_OperaNumerorum Beal

      - name: Check Lake manifest for dependency drift
        run: |
          set -euo pipefail

          if git diff --quiet -- lake-manifest.json; then
            echo "OK: lake-manifest.json stayed unchanged during the build"
            exit 0
          fi

          echo "FAIL: lake-manifest.json changed during the normal build"
          echo
          python3 - <<'PY'
          import json
          import subprocess
          import sys

          manifest_path = "lake-manifest.json"

          try:
              committed = json.loads(
                  subprocess.check_output(
                      ["git", "show", f"HEAD:{manifest_path}"],
                      text=True,
                  )
              )
              with open(manifest_path, encoding="utf-8") as manifest_file:
                  current = json.load(manifest_file)
          except (OSError, subprocess.CalledProcessError, json.JSONDecodeError) as error:
              print(f"Unable to summarize dependency revisions: {error}")
              sys.exit(0)

          def package_map(manifest):
              return {
                  (package.get("name"), package.get("url")): package
                  for package in manifest.get("packages", [])
                  if isinstance(package, dict)
              }

          committed_packages = package_map(committed)
          current_packages = package_map(current)

          changes = []
          for package_key in sorted(
              set(committed_packages) | set(current_packages),
              key=lambda key: (str(key[0]), str(key[1])),
          ):
              old = committed_packages.get(package_key)
              new = current_packages.get(package_key)
              package_name = package_key[0] or package_key[1] or "<unnamed package>"

              if old is None:
                  changes.append(
                      f"  added {package_name}: "
                      f"rev={new.get('rev', '<missing>')} "
                      f"inputRev={new.get('inputRev', '<missing>')}"
                  )
              elif new is None:
                  changes.append(
                      f"  removed {package_name}: "
                      f"rev={old.get('rev', '<missing>')} "
                      f"inputRev={old.get('inputRev', '<missing>')}"
                  )
              elif (
                  old.get("rev") != new.get("rev")
                  or old.get("inputRev") != new.get("inputRev")
              ):
                  changes.append(
                      f"  {package_name}: "
                      f"rev {old.get('rev', '<missing>')} -> "
                      f"{new.get('rev', '<missing>')}; "
                      f"inputRev {old.get('inputRev', '<missing>')} -> "
                      f"{new.get('inputRev', '<missing>')}"
                  )

          if changes:
              print("Dependency revision changes:")
              print("\n".join(changes))
          else:
              print("No package revision changed; the manifest has a structural or formatting drift.")
          PY

          echo
          echo "Full lake-manifest.json diff:"
          git --no-pager diff -- lake-manifest.json
          echo
          echo "An intentional dependency update must update lakefile.lean and lake-manifest.json together,"
          echo "review every pinned revision, and go through the normal release/dependency review before merge."
          exit 1

      - name: Check NO proof placeholders
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          forbidden = re.compile(r"\b(?:sorry|sorryAx|admit)\b")
          failures = []
          localized_sorry_walls = {
              Path("lean/Beal/Mazur/Gates/Kolyvagin_J0_26_NoSorry.lean"): 1,
              Path("lean/Beal/Mazur/Gates/FormalImmersion_J0_26_NoSorry.lean"): 1,
          }
          observed_localized_walls = {
              path: 0 for path in localized_sorry_walls
          }

          def executable_source(text: str) -> str:
              out = []
              i = 0
              block_depth = 0
              in_string = False
              in_interpolated = False
              pending_interpolation = False
              while i < len(text):
                  if block_depth:
                      if text.startswith("/-", i):
                          block_depth += 1
                          i += 2
                      elif text.startswith("-/", i):
                          block_depth -= 1
                          i += 2
                      else:
                          out.append("\n" if text[i] == "\n" else " ")
                          i += 1
                  elif in_interpolated:
                      # Conservatively retain the whole interpolated string.
                      # Lean terms inside `{...}` are executable, so treating
                      # the span as an ordinary inert string would hide proof
                      # placeholders. Text-only false positives are preferable
                      # to an admitted theorem passing CI.
                      if text[i] == "\\" and i + 1 < len(text):
                          out.extend(text[i:i + 2])
                          i += 2
                      elif text[i] == '"':
                          out.append(" ")
                          in_interpolated = False
                          i += 1
                      else:
                          out.append(text[i])
                          i += 1
                  elif in_string:
                      if text[i] == "\\" and i + 1 < len(text):
                          out.extend("  ")
                          i += 2
                      elif text[i] == '"':
                          out.append(" ")
                          in_string = False
                          i += 1
                      else:
                          out.append("\n" if text[i] == "\n" else " ")
                          i += 1
                  elif text.startswith("--", i):
                      end = text.find("\n", i)
                      if end == -1:
                          out.extend(" " * (len(text) - i))
                          break
                      out.extend(" " * (end - i))
                      out.append("\n")
                      i = end + 1
                  elif text.startswith("/-", i):
                      out.extend("  ")
                      block_depth = 1
                      i += 2
                  elif (
                      text[i] == "!"
                      and i > 0
                      and (text[i - 1].isalnum() or text[i - 1] in "_'")
                  ):
                      # Treat any identifier-suffixed `!` macro followed by a
                      # string as potentially interpolating executable Lean.
                      # This covers both `s!` and `f!` without baking in a
                      # closed list of interpolation macros.
                      out.append("!")
                      pending_interpolation = True
                      i += 1
                  elif text[i] == '"':
                      out.append(" ")
                      if pending_interpolation:
                          in_interpolated = True
                      else:
                          in_string = True
                      pending_interpolation = False
                      i += 1
                  else:
                      out.append(text[i])
                      if not text[i].isspace():
                          pending_interpolation = False
                      i += 1
              return "".join(out)

          regression_probes = {
              "inline sorry": ("theorem t : True := by sorry", True),
              "inline admit": ("theorem t : True := by admit", True),
              "interpolated sorry": ('def t : String := s!"{(by sorry : Nat)}"', True),
              "interpolated sorryAx": ('def t : String := s!"{sorryAx Nat true}"', True),
              "interpolated admit": ('def t : String := s!"{(by admit : Nat)}"', True),
              "spaced interpolated sorry": ('def t : String := s! "{(by sorry : Nat)}"', True),
              "spaced interpolated sorryAx": ('def t : String := s! "{sorryAx Nat true}"', True),
              "newline interpolated sorry": ('def t : String := s!\n"{(by sorry : Nat)}"', True),
              "newline interpolated sorryAx": ('def t : String := s!\n"{sorryAx Nat true}"', True),
              "line-comment interpolated sorry": (
                  'def t : String := s! -- comment\n"{(by sorry : Nat)}"',
                  True,
              ),
              "line-comment interpolated sorryAx": (
                  'def t : String := s! -- comment\n"{sorryAx Nat true}"',
                  True,
              ),
              "block-comment interpolated sorry": (
                  'def t : String := s! /- comment -/ "{(by sorry : Nat)}"',
                  True,
              ),
              "block-comment interpolated sorryAx": (
                  'def t : String := s! /- comment -/ "{sorryAx Nat true}"',
                  True,
              ),
              "format interpolated sorry": (
                  'def t : Std.Format := f!"{(by sorry : Nat)}"',
                  True,
              ),
              "spaced format interpolated sorryAx": (
                  'def t : Std.Format := f! "{sorryAx Nat true}"',
                  True,
              ),
              "commented format interpolated sorry": (
                  'def t : Std.Format := f! /- comment -/ "{(by sorry : Nat)}"',
                  True,
              ),
              "line-comment format interpolated sorryAx": (
                  'def t : Std.Format := f! -- comment\n"{sorryAx Nat true}"',
                  True,
              ),
              "line comment": ("-- sorryAx\n#check True", False),
              "nested block comment": ("/- outer /- sorry -/ sorryAx -/\n#check True", False),
              "ordinary string": ('def t := "sorry and sorryAx"', False),
          }
          for name, (probe, should_fail) in regression_probes.items():
              detected = bool(forbidden.search(executable_source(probe)))
              if detected != should_fail:
                  print(f"FAIL: placeholder scanner regression: {name}")
                  sys.exit(1)

          for path in sorted(Path("lean").rglob("*.lean")):
              source = executable_source(path.read_text(encoding="utf-8"))
              for line_number, line in enumerate(source.splitlines(), 1):
                  for match in forbidden.finditer(line):
                      if match.group() == "sorry" and path in localized_sorry_walls:
                          observed_localized_walls[path] += 1
                      else:
                          failures.append(
                              f"{path}:{line_number}:{match.start() + 1}: {match.group()}"
                          )

          if failures:
              print("FAIL: unexpected Lean proof placeholder found:")
              print("\n".join(failures))
              sys.exit(1)
          if observed_localized_walls != localized_sorry_walls:
              print("FAIL: the Beal analytic gate layer must contain exactly two localized sorry walls")
              for path, expected_count in localized_sorry_walls.items():
                  print(
                      f"{path}: expected {expected_count}, "
                      f"found {observed_localized_walls[path]}"
                  )
              sys.exit(1)
          print("OK: exactly two localized gate sorry walls; no other proof placeholders")
          PY

      - name: No undocumented Prop := True stubs
        run: |
          set -euo pipefail
          fail=0
          if grep -rnE ':\s*Prop\s*:=\s*True\b' lean/Beal/*_Core.lean; then
            echo "FAIL: Core file contains a trivial 'Prop := True' stub"
            fail=1
          fi
          if grep -rnE ':\s*Prop\s*:=\s*¬\s*False\b' lean/Beal/*_Core.lean; then
            echo "FAIL: Core file contains 'Prop := ¬ False' (equivalent to True)"
            fail=1
          fi
          if grep -nE ':\s*Prop\s*:=\s*True\b|:=\s*trivial\b|:=\s*by[[:space:]]+trivial\b' \
              lean/Beal/B17_FreyRationalTwoTorsion.lean \
              lean/Beal/B17_FullE2.lean \
              lean/Beal/B17_MazurIrreducible_Core.lean \
              lean/Beal/B17_MazurPrimeCoverage.lean \
              lean/Beal/B17_X0Moduli.lean \
              lean/Beal/Mazur/KernelToX0.lean \
              lean/Beal/Mazur/X0_26_Model.lean \
              lean/Beal/Mazur/X0_26_RationalPoints.lean; then
            echo "FAIL: B17 must not reintroduce True/trivial irreducibility placeholders"
            fail=1
          fi
          if grep -nE ':\s*Prop\s*:=\s*True\b|:\s*Prop\s*:=\s*¬\s*False\b|:=\s*trivial\b|:=\s*by[[:space:]]+trivial\b' \
              lean/Beal/B17_MazurIrreducible.lean \
              lean/Beal/B17_MazurPrimeCoverage.lean; then
            echo "FAIL: B17 must not contain a vacuous irreducibility or prime-coverage marker"
            fail=1
          fi
          if [ $fail -ne 0 ]; then exit 1; fi
          echo "OK: no undocumented trivial Prop stubs"

      - name: Audit every core and wrapper theorem
        run: |
          set -euo pipefail

          for core in lean/Beal/*_Core.lean; do
            if grep -nE '^[[:space:]]*import[[:space:]]' "$core"; then
              echo "FAIL: $core must remain import-free"
              exit 1
            fi
            if ! grep -qE '^#print axioms ' "$core"; then
              echo "FAIL: $core must audit each declaration with #print axioms"
              exit 1
            fi
          done

          {
            echo 'import Beal'
            grep -hE '^#print axioms ' lean/Beal/*_Core.lean
            cat <<'EOF'
          #print axioms BealFrey.freyΔ_ne_zero_of_solution
          #print axioms primitiveTripleCore_of_gcd_eq_one
          #print axioms gcd_eq_one_of_primitiveTripleCore
          #print axioms isBealSolution_wrapper_to_core
          #print axioms isBealSolutionCore_to_wrapper
          #print axioms bealConjecture_wrapper_to_core
          #print axioms bealConjectureCore_to_wrapper
          #print axioms frey_modular_of_pos
          #print axioms modularity_holds
          #print axioms qexp_implies_hecke
          #print axioms BealHasseWiles.hasse_bound_143a1_all
          #print axioms beal_bridge_proved
          #print axioms BealConjecture_trio_bridge
          #print axioms BealGalois.frey_galois_rep_of_pos
          #print axioms BealGalois.frey_irreducible_trivial
          #print axioms dimS2Gamma0_2_eq_zero
          #print axioms S2_vanishing_proved
          #print axioms ribet_open_trivial
          #print axioms beal_final_contradiction_of_S2
          #print axioms BealEpsilon.mazur_epsilon_trivial
          #print axioms BealEpsilon.frey_conductor_trivial
          #print axioms BealRibet12.beal_modular_contradiction_trivial
          #print axioms BealRibet12.ribet_contradiction_from_S2_vanishing
          #print axioms BealRibetReal.ribet_realDefs_trivial
          #print axioms BealRibetReal.level_to_2_trivial
          #print axioms BealFreyConductor.beal_primes_not_divide_conductor_trivial
          #print axioms BealLevelTo2.ribet_chain_to_2_gives_False
          #print axioms Beal16Final.beal_if_wiles_tate_ribet
          #print axioms Beal17Mazur.freyRationalCurve_discriminant
          #print axioms Beal17Mazur.freyRationalCurve_discriminant_ne_zero
          #print axioms Beal17Mazur.freyThreeDistinctRationalTwoTorsion
          #print axioms Beal17Mazur.Frey_E2_exhaustive
          #print axioms Beal17Mazur.freyTwoTorsion_affine_y_eq_zero
          #print axioms Beal17Mazur.freyFullE2_exhaustive
          #print axioms Beal17Mazur.freyFullE2_eq
          #print axioms Beal17Mazur.FreyMazurContext.hasThreeDistinctRationalTwoTorsion
          #print axioms Beal17Mazur.FreyMazurContext.hasFullRationalTwoTorsion
          #print axioms Beal17Mazur.FreyPTorsion
          #print axioms Beal17Mazur.galoisAction
          #print axioms Beal17Mazur.RationalPIsogenyKernel
           #print axioms Beal17Mazur.GaloisStableCyclicLevel
           #print axioms Beal17Mazur.X0ModuliDatum
           #print axioms Beal17Mazur.GaloisStableCyclicLevel.stable_mem
           #print axioms Beal17Mazur.GaloisStableCyclicLevel.carrier_nonempty
           #print axioms Beal17Mazur.GaloisStableCyclicLevel.level_pos
           #print axioms Beal17Mazur.X0ModuliDatum.level_card
           #print axioms Beal17Mazur.selectedRationalTwoPoint_mem_fullE2
           #print axioms Beal17Mazur.selectedGeometricTwoPoint_addOrderOf
           #print axioms Beal17Mazur.selectedTwoSubgroup_inf_kernel
           #print axioms Beal17Mazur.mixedLevelCarrier_eq_zmultiples
           #print axioms Beal17Mazur.mixedLevelCarrier_card
           #print axioms Beal17Mazur.mixedLevelCarrier_galois_stable
           #print axioms Beal17Mazur.mixedX0ModuliDatum
           #print axioms Beal17Mazur.residualReducible_implies_mixedX0ModuliDatum
           #print axioms Beal17Mazur.X0MixedLevelRealizationBoundary
           #print axioms Beal17Mazur.kernelToX0TwoPModuli
           #print axioms Beal17Mazur.reducibleToX0TwoPModuli
           #print axioms Beal17Mazur.X0_26_genus
           #print axioms Beal17Mazur.X0_26_cusp_count
           #print axioms Beal17Mazur.X0_26_cusps_Q_rational
           #print axioms Beal17Mazur.X0_26_completedSquare_identity
           #print axioms Beal17Mazur.X0_26_affinePointCounts
           #print axioms Beal17Mazur.X0_26_completedModelPointCounts
          #print axioms Beal17Mazur.FreyResidualRepresentationReducible
          #print axioms Beal17Mazur.FreyMazurContext.hasGoodReductionAtResidualPrime
          #print axioms Beal17Mazur.FreyMazurContext.isSemistableAtResidualPrime
          #print axioms Beal17Mazur.MazurRationalIsogenyClassification
          #print axioms Beal17Mazur.frey_irreducible_of_mazur
          #print axioms Beal17Mazur.frey_mazur_irreducibility_boundary
          #print axioms Beal17Mazur.b17_residual_prime_cases
          #print axioms Beal17Mazur.mazur_classification_of_complete_prime_inputs
          #print axioms Beal17Mazur.mazur_classification_of_global_certificate
          #print axioms Beal17Mazur.frey_irreducible_of_complete_prime_coverage
          #print axioms Beal17Mazur.prime_not_dvd_conductor
          #print axioms Beal17Mazur.remove_exact_divisor
          #print axioms Beal17Mazur.remove_exact_context_conductor_divisor
          #print axioms Beal18Frey.frey_disc_nonzero_trivial
          #print axioms Beal19Final.beal_proof_assembled
          #print axioms Beal19Final.beal_from_S2
          #print axioms Beal20Done.beal_conjecture_conditional_on_enriched_plan
          #print axioms Beal20Done.twenty_bricks_conditional
          #print axioms Beal21Fermat.beal_implies_fermat
          #print axioms Beal21Fermat.beal_conjecture_to_21_core
          #print axioms Beal21Fermat.beal_implies_fermat_full_core
          #print axioms Beal21Fermat.beal_implies_fermat_full
          EOF
          } > /tmp/beal_axiom_audit.lean

          lake env lean /tmp/beal_axiom_audit.lean 2>&1 | tee /tmp/beal_axiom_audit.txt

          while read -r _ _ declaration; do
            if ! grep -Fq "'$declaration' does not depend on any axioms" /tmp/beal_axiom_audit.txt; then
              echo "FAIL: core declaration $declaration is not zero-axiom"
              exit 1
            fi
          done < <(grep -hE '^#print axioms ' lean/Beal/*_Core.lean)

          if grep -Fq 'sorryAx' /tmp/beal_axiom_audit.txt; then
            echo "FAIL: wrapper theorem depends on sorryAx"
            exit 1
          fi

          # Foundational Lean dependencies (propext, Classical.choice, Quot.sound) are
          # not mathematical assumptions. Audit the final theorem's named domain axioms exactly.
          cat > /tmp/beal_final_axiom_audit.lean <<'EOF'
          import Beal
          #check fun
            (h : Beal20Done.BealConjectureConditionalOnEnrichedPlan)
            (enriched : Beal.RibetIterate.EnrichedPlanSupplier)
            (twoAdic : Beal20Done.TwoAdicExponentOneSupplier) =>
              h enriched twoAdic
          #print axioms Beal20Done.beal_conjecture_conditional_on_enriched_plan
          #print axioms Beal20Done.twenty_bricks_conditional
          EOF
          lake env lean /tmp/beal_final_axiom_audit.lean 2>&1 | tee /tmp/beal_final_axiom_audit.txt
          if grep -Fq 'sorryAx' /tmp/beal_final_axiom_audit.txt; then
            echo "FAIL: final theorem depends on sorryAx"
            exit 1
          fi
          printf '%s\n' \
            'Beal.FreyTate.TateStep2.frey_conductor_data' \
            'Beal.FreyTate.TateStep2.tate_step2_odd_prime_external' \
            'Beal.FreyTate.wiles_modularity' |
            sort -u > /tmp/beal_expected_domain_axioms.txt
          grep -oE 'Beal\.FreyTate(\.TateStep2)?\.[A-Za-z0-9_]+' \
            /tmp/beal_final_axiom_audit.txt |
            sort -u > /tmp/beal_actual_domain_axioms.txt
          if ! cmp -s \
            /tmp/beal_actual_domain_axioms.txt \
            /tmp/beal_expected_domain_axioms.txt; then
            echo "FAIL: final theorem must use exactly the three approved domain axioms"
            diff -u \
              /tmp/beal_expected_domain_axioms.txt \
              /tmp/beal_actual_domain_axioms.txt || true
            exit 1
          fi
          echo "OK: final theorem retains both explicit suppliers and uses exactly three approved domain axioms"
          echo "OK: all cores are import-free and zero-axiom; wrappers use no sorryAx"

      - name: Audit the genuine B17 Mazur boundary
        run: |
          set -euo pipefail
          b17_files=(
            lean/Beal/B17_FreyRationalTwoTorsion.lean
            lean/Beal/B17_FullE2.lean
            lean/Beal/B17_MazurIrreducible_Core.lean
            lean/Beal/B17_MazurIrreducible.lean
            lean/Beal/B17_MazurPrimeCoverage.lean
            lean/Beal/B17_X0Moduli.lean
            lean/Beal/Mazur/KernelToX0.lean
            lean/Beal/Mazur/X0_26_Model.lean
          )
          if grep -nE \
              '^[[:space:]]*(axiom|opaque|sorry|admit)([[:space:]]|$)' \
              "${b17_files[@]}"; then
            echo "FAIL: B17 source contains an axiom, opaque declaration, sorry, or admit"
            exit 1
          fi
          boundary_file=lean/Beal/Mazur/X0_26_RationalPoints.lean
          if grep -nE \
              '^[[:space:]]*(axiom|opaque|sorry|admit)([[:space:]]|$)' \
              "$boundary_file"; then
            echo "FAIL: 476d must be axiom-free and sorry-free"
            exit 1
          fi
          grep -q 'def TorsionIdentificationWall : Prop' "$boundary_file"
          grep -q 'def FormalImmersionExhaustivenessWall : Prop' "$boundary_file"
          grep -q 'def Frey13ToX0_26Realization : Prop' "$boundary_file"
          coverage_file=lean/Beal/B17_MazurPrimeCoverage.lean
          for prime in 11 17 19 23 29 31 37; do
            if ! grep -qE "^[[:space:]]+prime${prime}[[:space:]]*:[[:space:]]*SemistableExceptionalPrimeExclusion[[:space:]]+${prime}$" \
                "$coverage_file"; then
              echo "FAIL: complete B17 coverage is missing the explicit p=${prime} input"
              exit 1
            fi
            if ! grep -q "remaining\\.prime${prime}" "$coverage_file"; then
              echo "FAIL: the p=${prime} input is declared but not used"
              exit 1
            fi
          done
          if grep -qE '^[[:space:]]+prime13[[:space:]]*:' "$coverage_file"; then
            echo "FAIL: p=13 must use the level-26 rational-point theorem, not a generic field"
            exit 1
          fi
          grep -q 'Frey_13_exclusion_of_global_certificate level26' "$coverage_file"
          grep -q 'context.p = 23' "$coverage_file"
          grep -q 'context.p = 29' "$coverage_file"
          grep -q 'context.p = 31' "$coverage_file"
          grep -qE '^import[[:space:]]+Beal\.B17_MazurPrimeCoverage$' lean/Beal.lean
          if grep -nE \
