name: Smithery gateway tier-gate smoke check

# Detects a Smithery gateway outage before customers lose tool access.
# Creates a temporary keyless connection, verifies the PRO tier error
# is visible (isError true, upgrade URL present), verifies a FREE tool
# still succeeds, then removes the connection — whether or not the check
# passed.  Credentials are never printed in output.

on:
  push:
    branches: [main, master]
  schedule:
    # Check the Smithery gateway every 6 hours.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smithery-tier-gate:
    name: Smithery gateway — PRO gate + FREE tool smoke check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js (for npx smithery CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Require SMITHERY_API_KEY
        # Fail before pytest so a missing or empty secret causes an explicit
        # workflow failure (and triggers the Slack alert below) rather than a
        # silent pytest skip that makes CI look green while the gateway is unchecked.
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          if [ -z "$SMITHERY_API_KEY" ]; then
            echo "ERROR: SMITHERY_API_KEY is not configured as a repository secret."
            echo "The Smithery gateway cannot be smoke-tested without it."
            echo "Add SMITHERY_API_KEY to your repository Actions secrets and re-run."
            exit 1
          fi
          echo "SMITHERY_API_KEY is present — proceeding with tier-gate check."

      - name: Run Smithery tier-gate smoke check
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          pytest tests/test_smithery_live_tier_gate.py -v --tb=short 2>&1 | tee /tmp/smithery_tier_gate_results.txt
          exit ${PIPESTATUS[0]}

      - name: Write job summary
        if: always()
        run: |
          echo "## Smithery tier-gate — $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Server: \`davidjfox998/zerobeacon-1050\`  " >> "$GITHUB_STEP_SUMMARY"
          echo "PRO tool: \`mf_03_delivery_proof\`  " >> "$GITHUB_STEP_SUMMARY"
          echo "FREE tool: \`mf_01_beacon\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/smithery_tier_gate_results.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Alert on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          PAYLOAD=$(jq -nc \
            --arg ref "$REF_NAME" \
            --arg url "$RUN_URL" \
            --arg ts  "$TIMESTAMP" \
            '{
              "text": (":rotating_light: *Smithery gateway tier-gate FAILED* on `" + $ref + "`\n• Detected at: `" + $ts + "` UTC\n• The PRO tool did not return the expected upgrade error, or the FREE tool failed through the Smithery gateway.\n• Customers may not be seeing the correct tier response via Smithery.\n• See failing run: " + $url)
            }')

          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$SLACK_WEBHOOK_URL")
            echo "Slack webhook response status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "WARNING: Slack webhook returned HTTP $HTTP_STATUS"
            fi
          else
            echo "SLACK_WEBHOOK_URL secret is not set — skipping Slack alert"
            echo "Failing run: $RUN_URL"
          fi
