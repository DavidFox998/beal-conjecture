name: Verify Opera Lean health

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/verify-opera-lean-health.sh
      - .github/workflows/verify-opera-lean-health.yml
  pull_request:
    paths:
      - scripts/verify-opera-lean-health.sh
      - .github/workflows/verify-opera-lean-health.yml

jobs:
  build:
    name: Build all proof-health targets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          TOOLCHAIN="$(tr -d '[:space:]' < lean-toolchain)"
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify all README proof-health targets
        run: scripts/verify-opera-lean-health.sh