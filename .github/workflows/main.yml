                  while index < len(source) and source[index] != "\n":
                      output.append(" ")
                      index += 1
              elif source.startswith("/-", index):
                  comment_depth = 1
                  output.extend("  ")
                  index += 2
              else:
                  output.append(source[index])
                  index += 1
          print("".join(output), end="")
          PY

