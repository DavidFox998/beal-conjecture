name: beal-conjecture CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build all bricks
        run: lake build

      - name: Check NO sorry
        run: |
         ! grep -R --include="*.lean" "^\s*sorry" lean || (echo "FAIL: sorry found" && exit 1)
          echo "OK: 0 sorry"

      - name: Check axioms are trio only
        run: |
          echo 'import Beal.B01_Def
          #print axioms IsBealSolution
          #print axioms BealConjecture' > /tmp/check.lean
          lake env lean /tmp/check.lean

      - name: Lake exe check
        run: lake exe cache get || true
