name: Deploy Zerobeacon MF 1000 to Fly.io

on:
  push:
    branches: [main]

jobs:
  test:
    name: Tier-gate tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MCP tier-gate tests
        run: pytest test_mcp_tier_gate.py -v --tb=short

      - name: Run Stripe webhook tests
        run: pytest test_stripe_webhook.py -v --tb=short

      - name: Write test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          pytest test_mcp_tier_gate.py test_stripe_webhook.py -v --tb=short --no-header -q 2>&1 | tee /tmp/pytest_summary.txt || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/pytest_summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy -a zerobeacon-mf-1000 --remote-only --strategy immediate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
