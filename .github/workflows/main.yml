name: beal-conjecture CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Restore Lean toolchain and Mathlib cache
        id: lean-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            ~/.elan/update-hashes
            .lake/packages
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Get Mathlib binary cache
        if: steps.lean-cache.outputs.cache-hit != 'true'
        run: lake exe cache get

      - name: Verify Opera Numerorum is in the release build
        run: |
          set -euo pipefail
          module='lean/Beal/B00_OperaNumerorum.lean'
          entrypoint='lean/Beal.lean'

          if [ ! -f "$module" ]; then
            echo "FAIL: $module is missing."
            echo "Restore the Opera Numerorum module before running the release build."
            exit 1
          fi

          if ! grep -qE '^[[:space:]]*import[[:space:]]+Beal\.B00_OperaNumerorum([[:space:]]|$)' "$entrypoint"; then
            echo "FAIL: $entrypoint does not import Beal.B00_OperaNumerorum."
            echo "Add 'import Beal.B00_OperaNumerorum' to $entrypoint so the release build includes the module."
            exit 1
          fi

          echo "OK: Opera Numerorum is present and imported by the release entrypoint"

      - name: Build all bricks
        run: lake build +Beal.B00_OperaNumerorum Beal

      - name: Check level-26 external transcript integrity
        run: python3 scripts/check_level26_replay.py

      - name: Build level-26 p-adic certificate interface
        run: lake build Beal.Mazur.Gates.Descent_26_PadicCertificates

      - name: Check J0(26) decomposition witness
        run: python3 scripts/j0_26_decomp_certificate.py --check

      - name: Build J0(26) decomposition bridge
        run: lake build Beal.Mazur.Gates.J0_26_Decomp

      - name: Check formal-immersion witness
        run: python3 scripts/formal_immersion_26_certificate.py --check

      - name: Build formal-immersion bridge
        run: lake build Beal.Mazur.Gates.FormalImmersion_26

      - name: Check Lake manifest for dependency drift
        run: |
          set -euo pipefail

          if git diff --quiet -- lake-manifest.json; then
            echo "OK: lake-manifest.json stayed unchanged during the build"
            exit 0
          fi

          echo "FAIL: lake-manifest.json changed during the normal build"
          echo
          python3 - <<'PY'
          import json
          import subprocess
          import sys

          manifest_path = "lake-manifest.json"

          try:
              committed = json.loads(
                  subprocess.check_output(
                      ["git", "show", f"HEAD:{manifest_path}"],
                      text=True,
                  )
              )
              with open(manifest_path, encoding="utf-8") as manifest_file:
                  current = json.load(manifest_file)
          except (OSError, subprocess.CalledProcessError, json.JSONDecodeError) as error:
              print(f"Unable to summarize dependency revisions: {error}")
              sys.exit(0)

          def package_map(manifest):
              return {
                  (package.get("name"), package.get("url")): package
                  for package in manifest.get("packages", [])
                  if isinstance(package, dict)
              }

          committed_packages = package_map(committed)
          current_packages = package_map(current)

          changes = []
          for package_key in sorted(
              set(committed_packages) | set(current_packages),
              key=lambda key: (str(key[0]), str(key[1])),
          ):
              old = committed_packages.get(package_key)
              new = current_packages.get(package_key)
              package_name = package_key[0] or package_key[1] or "<unnamed package>"

              if old is None:
                  changes.append(
                      f"  added {package_name}: "
                      f"rev={new.get('rev', '<missing>')} "
                      f"inputRev={new.get('inputRev', '<missing>')}"
                  )
              elif new is None:
                  changes.append(
                      f"  removed {package_name}: "
                      f"rev={old.get('rev', '<missing>')} "
                      f"inputRev={old.get('inputRev', '<missing>')}"
                  )
              elif (
                  old.get("rev") != new.get("rev")
                  or old.get("inputRev") != new.get("inputRev")
              ):
                  changes.append(
                      f"  {package_name}: "
                      f"rev {old.get('rev', '<missing>')} -> "
                      f"{new.get('rev', '<missing>')}; "
                      f"inputRev {old.get('inputRev', '<missing>')} -> "
                      f"{new.get('inputRev', '<missing>')}"
                  )

          if changes:
              print("Dependency revision changes:")
              print("\n".join(changes))
          else:
              print("No package revision changed; the manifest has a structural or formatting drift.")
          PY

          echo
          echo "Full lake-manifest.json diff:"
          git --no-pager diff -- lake-manifest.json
          echo
          echo "An intentional dependency update must update lakefile.lean and lake-manifest.json together,"
          echo "review every pinned revision, and go through the normal release/dependency review before merge."
          exit 1

      - name: Check NO sorry
        run: |
          ! grep -R --include="*.lean" "^\s*sorry" lean || (echo "FAIL: sorry found" && exit 1)
          echo "OK: 0 sorry"

      - name: No Prop := True stubs in Core files
        run: |
          set -euo pipefail
          fail=0
          if grep -rnE ':\s*Prop\s*:=\s*True\b' lean/Beal/*_Core.lean; then
            echo "FAIL: Core file contains a trivial 'Prop := True' stub"
            fail=1
          fi
          if grep -rnE ':\s*Prop\s*:=\s*¬\s*False\b' lean/Beal/*_Core.lean; then
            echo "FAIL: Core file contains 'Prop := ¬ False' (equivalent to True)"
            fail=1
          fi
          if grep -nE ':\s*Prop\s*:=\s*True\b|:=\s*trivial\b|:=\s*by[[:space:]]+trivial\b' \
              lean/Beal/B17_FreyRationalTwoTorsion.lean \
              lean/Beal/B17_FullE2.lean \
              lean/Beal/B17_MazurIrreducible_Core.lean \
              lean/Beal/B17_MazurIrreducible.lean; then
            echo "FAIL: B17 must not reintroduce True/trivial irreducibility placeholders"
            fail=1
          fi
          if [ $fail -ne 0 ]; then exit 1; fi
          echo "OK: no trivial Prop stubs in Core files"

      - name: Audit every core and wrapper theorem
        run: |
          set -euo pipefail

          for core in lean/Beal/*_Core.lean; do
            if grep -nE '^[[:space:]]*import[[:space:]]' "$core"; then
              echo "FAIL: $core must remain import-free"
              exit 1
            fi
            if ! grep -qE '^#print axioms ' "$core"; then
              echo "FAIL: $core must audit each declaration with #print axioms"
              exit 1
            fi
          done

          {
            echo 'import Beal'
            grep -hE '^#print axioms ' lean/Beal/*_Core.lean
            cat <<'EOF'
          #print axioms BealFrey.freyΔ_ne_zero_of_solution
          #print axioms primitiveTripleCore_of_gcd_eq_one
          #print axioms gcd_eq_one_of_primitiveTripleCore
          #print axioms isBealSolution_wrapper_to_core
          #print axioms isBealSolutionCore_to_wrapper
          #print axioms bealConjecture_wrapper_to_core
          #print axioms bealConjectureCore_to_wrapper
          #print axioms frey_modular_of_pos
          #print axioms modularity_holds
          #print axioms qexp_implies_hecke
          #print axioms BealHasseWiles.hasse_bound_143a1_all
          #print axioms beal_bridge_proved
          #print axioms BealConjecture_trio_bridge
          #print axioms BealGalois.frey_galois_rep_of_pos
          #print axioms BealGalois.frey_irreducible_trivial
          #print axioms dimS2Gamma0_2_eq_zero
          #print axioms S2_vanishing_proved
          #print axioms ribet_open_trivial
          #print axioms beal_final_contradiction_of_S2
          #print axioms BealEpsilon.mazur_epsilon_trivial
          #print axioms BealEpsilon.frey_conductor_trivial
          #print axioms BealRibet12.beal_modular_contradiction_trivial
          #print axioms BealRibet12.ribet_contradiction_from_S2_vanishing
          #print axioms BealRibetReal.ribet_realDefs_trivial
          #print axioms BealRibetReal.level_to_2_trivial
          #print axioms BealFreyConductor.beal_primes_not_divide_conductor_trivial
          #print axioms BealLevelTo2.ribet_chain_to_2_gives_False
          #print axioms Beal16Final.beal_if_wiles_tate_ribet
          #print axioms Beal17Mazur.freyRationalCurve_discriminant
          #print axioms Beal17Mazur.freyRationalCurve_discriminant_ne_zero
          #print axioms Beal17Mazur.freyThreeDistinctRationalTwoTorsion
          #print axioms Beal17Mazur.Frey_E2_exhaustive
          #print axioms Beal17Mazur.freyTwoTorsion_affine_y_eq_zero
          #print axioms Beal17Mazur.freyFullE2_exhaustive
          #print axioms Beal17Mazur.freyFullE2_eq
          #print axioms Beal17Mazur.FreyMazurContext.hasThreeDistinctRationalTwoTorsion
          #print axioms Beal17Mazur.FreyMazurContext.hasFullRationalTwoTorsion
          #print axioms Beal17Mazur.FreyPTorsion
          #print axioms Beal17Mazur.galoisAction
          #print axioms Beal17Mazur.RationalPIsogenyKernel
          #print axioms Beal17Mazur.FreyResidualRepresentationReducible
          #print axioms Beal17Mazur.MazurIrreducibilityBoundary
          #print axioms Beal17Mazur.MazurRationalIsogenyClassification
          #print axioms Beal17Mazur.frey_irreducible_of_mazur
          #print axioms Beal17Mazur.frey_mazur_irreducibility_boundary
          #print axioms Beal17Mazur.prime_not_dvd_conductor
          #print axioms Beal17Mazur.remove_exact_divisor
          #print axioms Beal17Mazur.remove_exact_context_conductor_divisor
          #print axioms Beal18Frey.frey_disc_nonzero_trivial
          #print axioms Beal19Final.beal_proof_assembled
          #print axioms Beal19Final.beal_from_S2
          #print axioms Beal20Done.beal_conjecture_conditional_on_enriched_plan
          #print axioms Beal20Done.twenty_bricks_conditional
          #print axioms Beal21Fermat.beal_implies_fermat
          #print axioms Beal21Fermat.beal_conjecture_to_21_core
          #print axioms Beal21Fermat.beal_implies_fermat_full_core
          #print axioms Beal21Fermat.beal_implies_fermat_full
          EOF
          } > /tmp/beal_axiom_audit.lean

          lake env lean /tmp/beal_axiom_audit.lean 2>&1 | tee /tmp/beal_axiom_audit.txt

          while read -r _ _ declaration; do
            if ! grep -Fq "'$declaration' does not depend on any axioms" /tmp/beal_axiom_audit.txt; then
              echo "FAIL: core declaration $declaration is not zero-axiom"
              exit 1
            fi
          done < <(grep -hE '^#print axioms ' lean/Beal/*_Core.lean)

          if grep -Fq 'sorryAx' /tmp/beal_axiom_audit.txt; then
            echo "FAIL: wrapper theorem depends on sorryAx"
            exit 1
          fi

          # Foundational Lean dependencies (propext, Classical.choice, Quot.sound) are
          # not mathematical assumptions. Audit the final theorem's named domain axioms exactly.
          cat > /tmp/beal_final_axiom_audit.lean <<'EOF'
          import Beal
          #check fun
            (h : Beal20Done.BealConjectureConditionalOnEnrichedPlan)
            (enriched : Beal.RibetIterate.EnrichedPlanSupplier)
            (twoAdic : Beal20Done.TwoAdicExponentOneSupplier) =>
              h enriched twoAdic
          #print axioms Beal20Done.beal_conjecture_conditional_on_enriched_plan
          #print axioms Beal20Done.twenty_bricks_conditional
          EOF
          lake env lean /tmp/beal_final_axiom_audit.lean 2>&1 | tee /tmp/beal_final_axiom_audit.txt
          if grep -Fq 'sorryAx' /tmp/beal_final_axiom_audit.txt; then
            echo "FAIL: final theorem depends on sorryAx"
            exit 1
          fi
          printf '%s\n' \
            'Beal.FreyTate.TateStep2.frey_conductor_data' \
            'Beal.FreyTate.TateStep2.tate_step2_odd_prime_external' \
            'Beal.FreyTate.wiles_modularity' |
            sort -u > /tmp/beal_expected_domain_axioms.txt
          grep -oE 'Beal\.FreyTate(\.TateStep2)?\.[A-Za-z0-9_]+' \
            /tmp/beal_final_axiom_audit.txt |
            sort -u > /tmp/beal_actual_domain_axioms.txt
          if ! cmp -s \
            /tmp/beal_actual_domain_axioms.txt \
            /tmp/beal_expected_domain_axioms.txt; then
            echo "FAIL: final theorem must use exactly the three approved domain axioms"
            diff -u \
              /tmp/beal_expected_domain_axioms.txt \
              /tmp/beal_actual_domain_axioms.txt || true
            exit 1
          fi
          echo "OK: final theorem retains both explicit suppliers and uses exactly three approved domain axioms"
          echo "OK: all cores are import-free and zero-axiom; wrappers use no sorryAx"

      - name: Audit the genuine B17 Mazur boundary
        run: |
          set -euo pipefail
          cat > /tmp/beal_b17_mazur_audit.lean <<'EOF'
          import Beal.B17_MazurIrreducible
          #print axioms Beal17Mazur.FreyPTorsion
          #print axioms Beal17Mazur.galoisAction
          #print axioms Beal17Mazur.RationalPIsogenyKernel
          #print axioms Beal17Mazur.FreyResidualRepresentationReducible
          #print axioms Beal17Mazur.MazurIrreducibilityBoundary
          #print axioms Beal17Mazur.MazurRationalIsogenyClassification
          #print axioms Beal17Mazur.frey_irreducible_of_mazur
          #print axioms Beal17Mazur.frey_mazur_irreducibility_boundary
          EOF
          lake env lean /tmp/beal_b17_mazur_audit.lean 2>&1 |
            tee /tmp/beal_b17_mazur_audit.txt
          if grep -Fq 'sorryAx' /tmp/beal_b17_mazur_audit.txt; then
            echo "FAIL: B17 Mazur boundary depends on sorryAx"
            exit 1
          fi
          if grep -Eq \
              '^[[:space:]]*axiom[[:space:]]+frey_irreducibility_external([[:space:]]|$)' \
              lean/Beal/B17_MazurIrreducible.lean; then
            echo "FAIL: B17 restored the deleted global Mazur axiom"
            exit 1
          fi
          if ! grep -A5 -F \
              "'Beal17Mazur.frey_irreducible_of_mazur' depends on axioms:" \
              /tmp/beal_b17_mazur_audit.txt >/dev/null; then
            echo "FAIL: the theorem-valued Mazur supplier boundary is missing"
            exit 1
          fi
          echo "OK: B17 uses genuine geometric p-torsion and an explicit theorem-valued Mazur supplier"

      - name: Test the B20 axiom-output parser
        run: bash scripts/test-check-b20-axioms.sh

      - name: Confirm B20 transitive axiom graph
        run: bash scripts/check-b20-axioms.sh

      - name: Audit the trusted real-number transport boundary
        run: |
          set -euo pipefail
          cat > /tmp/beal_real_boundary.lean <<'EOF'
          import Beal.B05_HasseWiles
          #print axioms BealHasseWiles.BSD_HasseFull_143_CLOSED
          EOF
          lake env lean /tmp/beal_real_boundary.lean 2>&1 | tee /tmp/beal_real_boundary.txt
          if grep -E 'sorryAx' /tmp/beal_real_boundary.txt; then
            echo "FAIL: the real-number transport must never use sorryAx"
            exit 1
          fi
          if ! grep -Fq "'BealHasseWiles.BSD_HasseFull_143_CLOSED' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/beal_real_boundary.txt; then
            echo "FAIL: unexpected axiom budget for the documented real-number transport"
            exit 1
          fi
          echo "OK: real-number transport has its documented Mathlib quotient boundary"

      - name: Audit the desert-brothers real bridge boundary
        run: |
          set -euo pipefail
          cat > /tmp/beal_desert_real_bridge.lean <<'EOF'
          import Beal.Galois.«07h_DesertInfra»
          #print axioms Beal.ArakelovRH.DesertBrothers.EutheosJitter
          #print axioms Beal.ArakelovRH.DesertBrothers.realJitter_of_fixedPoint
          #print axioms Beal.Galois.EutheosComplementSketch
          #print axioms Beal.Galois.OldNewDecompHyp_from_EutheosSketch
          #print axioms Beal.Galois.EutheosGeometryInterface
          #print axioms Beal.Galois.separation_kernel
          #print axioms Beal.Galois.OldNewDecompHyp_from_Eutheos
          EOF
          lake env lean /tmp/beal_desert_real_bridge.lean 2>&1 |
            tee /tmp/beal_desert_real_bridge.txt
          if grep -E 'sorryAx' /tmp/beal_desert_real_bridge.txt; then
            echo "FAIL: the desert-brothers bridge must never use sorryAx"
            exit 1
          fi
          if grep -Fq "'Beal.ArakelovRH.DesertBrothers.EutheosJitter' depends on axioms" \
              /tmp/beal_desert_real_bridge.txt; then
            echo "FAIL: the fixed-point jitter certificate must remain axiom-free"
            exit 1
          fi
          if ! grep -Fq "'Beal.ArakelovRH.DesertBrothers.realJitter_of_fixedPoint' depends on axioms: [propext, Classical.choice, Quot.sound]" \
              /tmp/beal_desert_real_bridge.txt; then
            echo "FAIL: unexpected axiom budget for the real jitter bridge"
            exit 1
          fi
          if ! grep -Fq "'Beal.Galois.EutheosComplementSketch' depends on axioms: [propext, Quot.sound]" \
              /tmp/beal_desert_real_bridge.txt; then
            echo "FAIL: the 07h sketch must remain choice-free"
            exit 1
          fi
          if ! grep -Fq "'Beal.Galois.OldNewDecompHyp_from_EutheosSketch' depends on axioms: [propext, Quot.sound]" \
              /tmp/beal_desert_real_bridge.txt; then
            echo "FAIL: the 07h supplier must remain choice-free"
            exit 1
          fi
          if ! grep -Fq "'Beal.Galois.EutheosGeometryInterface' depends on axioms: [propext, Quot.sound]" \
              /tmp/beal_desert_real_bridge.txt; then
            echo "FAIL: the typed Eutheos geometry interface must remain choice-free"
            exit 1
          fi
          if ! grep -Fq "'Beal.Galois.separation_kernel' depends on axioms: [propext, Quot.sound]" \
              /tmp/beal_desert_real_bridge.txt; then
            echo "FAIL: the Eutheos separation kernel must remain choice-free"
            exit 1
          fi
          if ! grep -Fq "'Beal.Galois.OldNewDecompHyp_from_Eutheos' depends on axioms: [propext, Quot.sound]" \
              /tmp/beal_desert_real_bridge.txt; then
            echo "FAIL: the Eutheos old/new supplier must remain choice-free"
            exit 1
          fi
          echo "OK: real jitter transport is isolated from the choice-free 07h boundary"

      - name: Audit the Taylor-Wiles patching boundary
        run: |
          set -euo pipefail
          if grep -R --include='*.lean' -nE \
              '^[[:space:]]*(sorry|opaque|axiom)[[:space:]]' lean/Beal/Patching; then
            echo "FAIL: patching modules must not introduce sorry, opaque declarations, or axioms"
            exit 1
          fi
          if grep -nE '^[[:space:]]*hRank[[:space:]]*:' lean/Beal/B15_RibetIterate.lean; then
            echo "FAIL: B15 must derive localized rank one from patching data"
            exit 1
          fi
          cat > /tmp/beal_patching_audit.lean <<'EOF'
          import Beal.Patching.RankOne
          #print axioms Beal.Patching.RankOneCoordinates.toLinearEquiv
          #print axioms Beal.Patching.PatchingSpecializationData.toRankOneCoordinates
          #print axioms Beal.Patching.finite_level_free
          #print axioms Beal.Patching.M_infty_free
          #print axioms Beal.Patching.depth_module_ge_ring
          #print axioms Beal.Patching.LocalizedRankOne_from_Patching
          EOF
          lake env lean /tmp/beal_patching_audit.lean 2>&1 |
            tee /tmp/beal_patching_audit.txt
          if grep -E 'sorryAx|Classical\.choice|Beal\.[A-Za-z0-9_.]*axiom' \
              /tmp/beal_patching_audit.txt; then
            echo "FAIL: patching-to-rank-one must remain choice-free and use no named axiom"
            exit 1
          fi
          for declaration in \
            Beal.Patching.RankOneCoordinates.toLinearEquiv \
            Beal.Patching.PatchingSpecializationData.toRankOneCoordinates \
            Beal.Patching.finite_level_free \
            Beal.Patching.M_infty_free \
            Beal.Patching.depth_module_ge_ring \
            Beal.Patching.LocalizedRankOne_from_Patching; do
            if ! grep -Fq "'$declaration' depends on axioms: [propext, Quot.sound]" \
                /tmp/beal_patching_audit.txt; then
              echo "FAIL: unexpected axiom budget for $declaration"
              exit 1
            fi
          done
          echo "OK: explicit patching data constructs rank one within [propext, Quot.sound]"

      - name: Verify B01 core has zero imports and zero axioms
        run: |
          if grep -nE '^[[:space:]]*import[[:space:]]' lean/Beal/B01_Def_Core.lean; then
            echo "FAIL: B01_Def_Core must remain import-free"
            exit 1
          fi
          cat > /tmp/check_b01_axioms.lean <<'EOF'
          import Beal.B01_Def_Core
          import Beal.B01_Def
          #print axioms IsBealSolutionCore
          #print axioms BealConjectureCore
          #print axioms IsBealSolution
          #print axioms BealConjecture
          #print axioms primitiveTripleCore_of_gcd_eq_one
          #print axioms gcd_eq_one_of_primitiveTripleCore
          #print axioms isBealSolution_wrapper_to_core
          #print axioms isBealSolutionCore_to_wrapper
          #print axioms bealConjecture_wrapper_to_core
          #print axioms bealConjectureCore_to_wrapper
          EOF
          lake env lean /tmp/check_b01_axioms.lean 2>&1 | tee /tmp/check_b01_axioms.txt
          if grep -E "'(IsBealSolutionCore|BealConjectureCore)' depends on axioms" /tmp/check_b01_axioms.txt; then
            echo "FAIL: B01 core definitions must not depend on axioms"
            exit 1
          fi
          if grep -E 'Classical\.choice|Quot\.sound|sorryAx' /tmp/check_b01_axioms.txt; then
            echo "FAIL: B01 wrapper must not use forbidden axioms"
            exit 1
          fi
          echo "OK: B01 core is zero-axiom; gcd compatibility stays within the wrapper budget"

      - name: Verify B02 core is zero-axiom and proof uses only propext
        run: |
          if grep -nE '^[[:space:]]*import[[:space:]]' lean/Beal/B02_Frey_Core.lean; then
            echo "FAIL: B02_Frey_Core must remain import-free"
            exit 1
          fi
          cat > /tmp/check_b02_axioms.lean <<'EOF'
          import Beal.B02_Frey_Core
          import Beal.B02_Frey
          #print axioms FreyDeltaCore
          #print axioms FreyNonzeroCore
          #print axioms BealFrey.freyΔ
          #print axioms BealFrey.freyΔ_ne_zero_of_solution
          EOF
          lake env lean /tmp/check_b02_axioms.lean 2>&1 | tee /tmp/check_b02_axioms.txt
          if grep -E "'Frey(Delta|Nonzero)Core' depends on axioms" /tmp/check_b02_axioms.txt; then
            echo "FAIL: B02 core must have no axioms"
            exit 1
          fi
          if grep -E "'BealFrey\.(freyΔ|freyΔ_ne_zero_of_solution)' depends on axioms:" /tmp/check_b02_axioms.txt | grep -Ev '\[propext\]'; then
            echo "FAIL: B02 proof may depend only on propext"
            exit 1
          fi
          if grep -E "Classical\.choice|Quot\.sound|sorryAx" /tmp/check_b02_axioms.txt; then
            echo "FAIL: forbidden B02 axiom dependency"
            exit 1
          fi
          echo "OK: B02 core is axiom-free; B02 proof uses only propext"

      - name: Verify Layer 5 Hecke boundary
        run: |
          set -euo pipefail
          hecke_file=lean/Beal/Galois/05_Hecke.lean
          hecke_code=/tmp/layer5_hecke_code.lean

          # Remove Lean comments before checking the source itself. The boundary
          # documentation intentionally names excluded concepts, but those names
          # must not occur in executable declarations.
          python3 - "$hecke_file" > "$hecke_code" <<'PY'
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1]).read_text()
          output = []
          index = 0
          comment_depth = 0
          while index < len(source):
              if comment_depth:
                  if source.startswith("/-", index):
                      comment_depth += 1
                      output.extend("  ")
                      index += 2
                  elif source.startswith("-/", index):
                      comment_depth -= 1
                      output.extend("  ")
                      index += 2
                  else:
