name: Lean Build -- Brothers Desert Proof

    on:
    push:
    pull_request:

    jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Install Elan
          run: |
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain leanprover/lean4:v4.15.0
            echo "$HOME/.elan/bin" >> $GITHUB_PATH

        - name: Lake update
          run: lake update

        # -- Object layer (0 sorry) ------------------------------------------------
        - name: "Eutheos -- Object (theta0, dist_pos_of_irrational, gate, route unitary)"
          run: lake build Eutheos.Object

        - name: "Eutheos -- Theta (zeta_half from Mathlib, theta=arg/2pi, honest conditional)"
          run: lake build Eutheos.Theta

        # -- Rational-theta contradiction (SORRY 1 tagged) -------------------------
        - name: "Eutheos -- RationalTheta (rational_gives_zero_dist, brothers_Nodup_1419, frac_inj, SORRY1=SuperbrickFE)"
          run: lake build Eutheos.RationalTheta

        # -- Bridge + Assembly -----------------------------------------------------
        - name: "Eutheos -- Bridge (RiemannHypothesis defn, bridge_equivalence, SORRY2+3)"
          run: lake build Eutheos.Bridge

        - name: "Eutheos -- RH (theta_irrational, ThetaSelfSymmetryRH_proved, riemannHypothesis)"
          run: lake build Eutheos.RH

        # -- Ramanujan factorization (0 sorry) -------------------------------------
        - name: "Eutheos -- RamanujanFactorization (0 sorry, pure algebra, alpha-beta witnesses)"
          run: lake build Eutheos.RamanujanFactorization

        # -- RouteC: Bost-Connes → Ramanujan → GRH --------------------------------
        - name: "Route -- RouteC (Deligne axiom, Bost-Connes thm6, M9/M10 steps, p5 boundary)"
          run: lake build Route.RouteC

        # -- SIEGEL ----------------------------------------------------------------
        - name: "Siegel -- SiegelZeroFree (D_eff<bound, c1>threshold, ratio>1, SORRY=repulsion)"
          run: lake build Siegel.SiegelZeroFree

        # -- SelfSymmetry layer ----------------------------------------------------
        - name: "SelfSymmetry -- Core (35 brothers, Nodup, pop6, Hamming>=2)"
          run: lake build SelfSymmetry.Core

        - name: "SelfSymmetry -- Desert (S4 exceptional, desert empty, mod-191 injective)"
          run: lake build SelfSymmetry.Desert

        - name: "SelfSymmetry -- JitterSymmetry (pi/10 irrational, Nodup 1419, EMI -30dB)"
          run: lake build SelfSymmetry.JitterSymmetry

        - name: "SelfSymmetry -- TwinWormhole (twin-prime product injectivity)"
          run: lake build SelfSymmetry.TwinWormhole

        - name: "SelfSymmetry -- ClayWitness (GapMCSP L=2240>33, self-symmetry certificate)"
          run: lake build SelfSymmetry.ClayWitness

        - name: "Protocol -- Chain (master certificate, all four properties)"
          run: lake build Protocol.Chain
    