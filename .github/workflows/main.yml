name: Deploy Zerobeacon MF 1000 to Fly.io

on:
  push:
    branches: [main, ci-gate-verify]

jobs:
  test:
    name: Tier-gate tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all tests
        run: |
          pytest test_mcp_tier_gate.py test_stripe_webhook.py test_no_body_api_key.py test_mcp_tool_tiers.py test_admin_reset.py -v --tb=short 2>&1 | tee /tmp/pytest_results.txt
          exit ${PIPESTATUS[0]}

      - name: Write test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/pytest_results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy -a zerobeacon-mf-1000 --remote-only --strategy immediate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  smoke-test:
    name: Post-deploy smoke test (branded domain)
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install requests pytest

      - name: Wait for Fly.io deploy to go live
        run: sleep 15

      - name: Smoke test — branded domain + RapidAPI trial flow
        run: |
          pytest test_smoke_domain.py test_rapidapi_e2e.py -v --tb=short 2>&1 | tee /tmp/smoke_results.txt
          exit ${PIPESTATUS[0]}

      - name: Write smoke-test summary
        if: always()
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Endpoints: \`/api/mf/01/beacon\` (free) · \`/api/mf/03/delivery_proof\` (pro)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/smoke_results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
