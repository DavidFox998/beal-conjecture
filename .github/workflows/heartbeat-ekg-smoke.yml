name: Heartbeat EKG Smoke Tests

# Confirms /brain/heartbeat serves a well-formed EKG page after every push:
#   Unit tests  (TestClient, always run in CI):
#     - HTTP 200 with text/html content-type
#     - <canvas id="c"> element is present
#     - setInterval beat loop and popcount32 function are present
#     - canonical beacon value 1d2c7a5b is embedded
#
#   Browser tests (Playwright, run in CI against a local uvicorn server):
#     - Canvas has non-zero rendered width and height
#     - No JS console errors thrown within the first 3 seconds
#     - beat() tick counter advances (beat loop is not frozen)
#
#   Live tests  (optional, against https://zerobeacon.ai on push to main/master):
#     - Same HTML-content checks against the deployed URL

on:
  push:
  pull_request:
  schedule:
    # Run against production every 30 minutes alongside the README smoke tests
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  heartbeat-ekg-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx requests pytest-playwright pytest-json-report

      - name: Install Playwright Chromium browser
        if: github.event_name != 'schedule'
        run: playwright install chromium --with-deps

      # ── Unit tests (TestClient — always run, no server needed) ─────────────
      - name: Run unit EKG smoke tests (TestClient)
        run: pytest tests/test_heartbeat_ekg.py -v -k "not live"

      # ── Summary card unit tests (no server needed) ────────────────────────
      # Exercises both the pass and failure paths of scripts/write_beat_summary.py
      # with synthetic pytest-json-report fixtures so CI catches a broken card
      # before it goes live.  Runs even when PLAYWRIGHT_BASE_URL is not set.
      - name: Run beat-rate summary card unit tests
        run: pytest tests/test_beat_summary_card.py -v

      # ── Browser tests (Playwright — local uvicorn server) ──────────────────
      # Skipped on the 30-min cron schedule — Playwright install (~2 min, ~300 MB)
      # is not worth the cost for a scheduled canary that only needs unit tests and
      # the live HTTP check.  Playwright runs on push / PR / workflow_dispatch only.
      - name: Start local uvicorn server for Playwright tests
        if: github.event_name != 'schedule'
        run: |
          uvicorn zerobeacon_mf_1000_main:app --host 127.0.0.1 --port 8765 &
          # Wait until the server accepts connections (up to 30 s)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/health > /dev/null && echo "Server ready after ${i}s" && break
            sleep 1
          done

      - name: Run Playwright EKG canvas tests (local server)
        if: github.event_name != 'schedule'
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8765
        run: |
          pytest tests/test_heartbeat_playwright.py -v \
            --json-report --json-report-file=/tmp/beat-report.json

      - name: Upload Playwright JSON report
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: ekg-beat-report
          path: /tmp/beat-report.json
          if-no-files-found: warn

      - name: Write beat-rate job summary
        if: always() && github.event_name != 'schedule'
        run: python3 scripts/write_beat_summary.py /tmp/beat-report.json --heading "EKG Beat-Rate"

      # ── Live tests (against production — best-effort canary) ───────────────
      - name: Run unit EKG smoke tests against https://zerobeacon.ai
        # continue-on-error so a temporarily down endpoint doesn't block CI.
        # The unit tests and Playwright tests above always guard correctness;
        # live tests are post-deploy canary runs.
        continue-on-error: true
        env:
          ZEROBEACON_URL: https://zerobeacon.ai
        run: pytest tests/test_heartbeat_ekg.py -v -k "live"

      # ── Webhook alert on failure ───────────────────────────────────────────
      # NOTE: the cold-start beat-rate Playwright test runs in the separate
      # ekg-coldstart-beat-rate job below (workflow_dispatch / push / PR only —
      # intentionally excluded from the 30-min cron to avoid Playwright install
      # overhead on every scheduled run).

      
      - name: Alert on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          PAYLOAD=$(jq -nc \
            --arg ref "$REF_NAME" \
            --arg url "$RUN_URL" \
            --arg ts  "$TIMESTAMP" \
            '{"text": ("*EKG canvas smoke tests FAILED* on `" + $ref + "`\n• Detected at: `" + $ts + "` UTC\n• Endpoint under test: `https://zerobeacon.ai/brain/heartbeat`\n• See failing run: " + $url)}')

          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$SLACK_WEBHOOK_URL")
            echo "Slack webhook response status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "WARNING: Slack webhook returned HTTP $HTTP_STATUS — check the SLACK_WEBHOOK_URL secret"
            fi
          else
            echo "SLACK_WEBHOOK_URL secret is not set — skipping webhook notification"
            echo "To enable alerts, add SLACK_WEBHOOK_URL to your repository secrets."
            echo "Failing run: $RUN_URL"
          fi

  # ── Optional cold-start beat-rate job ──────────────────────────────────────
  # Runs on push, PR, and manual workflow_dispatch — intentionally EXCLUDED from
  # the 30-min cron schedule to avoid Playwright install overhead on every probe.
  # Validates that the 200 ms setInterval fires ≥5 times in 2 seconds after a
  # simulated cold start, and that no JS console errors appear in that window.
  ekg-coldstart-beat-rate:
    runs-on: ubuntu-latest
    # Only run on push / PR / manual dispatch — never on the scheduled cron.
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-playwright pytest-json-report

      - name: Install Playwright Chromium browser
        run: playwright install chromium --with-deps

      - name: Start local uvicorn server
        run: |
          uvicorn zerobeacon_mf_1000_main:app --host 127.0.0.1 --port 8765 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/health > /dev/null && echo "Server ready after ${i}s" && break
            sleep 1
          done

      - name: Run cold-start beat-rate test (≥5 ticks in 2 s, no JS errors)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8765
        run: |
          pytest tests/test_heartbeat_playwright.py \
            -v -k "test_beat_fires_at_200ms_rate_cold_start" \
            --json-report --json-report-file=/tmp/beat-report.json

      - name: Upload cold-start Playwright JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekg-coldstart-beat-report
          path: /tmp/beat-report.json
          if-no-files-found: warn

      - name: Write beat-rate job summary
        if: always()
        run: python3 scripts/write_beat_summary.py /tmp/beat-report.json

      - name: Fire Slack alert on cold-start beat-rate failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "[ekg-coldstart-alert] SLACK_WEBHOOK_URL is not configured"
            exit 1
          fi
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RUN_URL="https://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}"
          # Build the payload with jq so special characters in repo/run-id
          # cannot produce invalid JSON (a heredoc with github context
          # expressions leaves literal backslashes that make Slack return 400).
          PAYLOAD=$(jq -nc \
            --arg ts   "$TIMESTAMP" \
            --arg url  "$RUN_URL" \
            '{
              "text": ":rotating_light: *EKG cold-start beat-rate test failed*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": (":rotating_light: *EKG cold-start beat-rate test failed*\n*Workflow:* `ekg-coldstart-beat-rate`\n*Time:* `" + $ts + "`\n*Detail:* The 200 ms beat loop fired fewer than 5 times in 2 seconds, or a JS console error was detected. The Fly.io VM may not be waking fast enough after auto_stop, or the beat loop has regressed.\n*Fix:* " + $url)
                  }
                }
              ]
            }')
          HTTP_STATUS=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --max-time 20 -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "204" ]; then
            echo "[ekg-coldstart-alert] Slack webhook returned unexpected status ${HTTP_STATUS}"
            exit 1
          else
            echo "[ekg-coldstart-alert] Slack alert delivered (HTTP ${HTTP_STATUS})"
          fi
