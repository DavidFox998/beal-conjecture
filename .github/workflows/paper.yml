# Build the 26-page MCOM submission PDF and its synchronized copies.
# Tectonic 0.15.0 matches the local rebuild of paper/mcom-draft.tex.
# This workflow does not mint a DOI and does not create a release.
name: Paper PDF

on:
  push:
    paths:
      - paper/mcom-draft.tex
      - papers/main.tex
      - paper/v33-standalone/main.tex
      - .github/workflows/paper.yml
  workflow_dispatch:

concurrency:
  group: paper-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Tectonic 0.15.0 and Poppler
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          curl -fsSL -o /tmp/tectonic.tar.gz \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/tectonic.tar.gz -C /tmp
          sudo mv /tmp/tectonic /usr/local/bin/tectonic
          tectonic --version

      - name: Build the canonical manuscript once
        working-directory: paper
        run: |
          set -euo pipefail
          tectonic mcom-draft.tex 2>&1 | tee /tmp/tectonic.log
          if grep -Ei 'overfull|undefined references|undefined citation|emergency stop' /tmp/tectonic.log; then
            echo "Tectonic reported an overfull box or an undefined reference"
            exit 1
          fi

      - name: Synchronize sources and the single compiled PDF
        run: |
          set -euo pipefail
          mkdir -p papers paper/v33-standalone
          cp paper/mcom-draft.tex papers/main.tex
          cp paper/mcom-draft.pdf papers/main.pdf
          cp paper/mcom-draft.tex paper/v33-standalone/main.tex
          cp paper/mcom-draft.pdf paper/v33-standalone/main.pdf
          cmp paper/mcom-draft.tex papers/main.tex
          cmp paper/mcom-draft.tex paper/v33-standalone/main.tex
          cmp paper/mcom-draft.pdf papers/main.pdf
          cmp paper/mcom-draft.pdf paper/v33-standalone/main.pdf
          md5sum paper/mcom-draft.pdf papers/main.pdf paper/v33-standalone/main.pdf

      - name: Check page count, phrases, and link borders
        run: |
          set -euo pipefail
          pages=$(pdfinfo paper/mcom-draft.pdf | awk '/^Pages:/ {print $2}')
          echo "pages=${pages}"
          test "$pages" = "26"
          for copy in papers/main.pdf paper/v33-standalone/main.pdf; do
            test "$(pdfinfo "$copy" | awk '/^Pages:/ {print $2}')" = "26"
            cmp paper/mcom-draft.pdf "$copy"
          done
          pdftotext paper/mcom-draft.pdf /tmp/mcom.txt
          python3 - << 'PY'
          from pathlib import Path
          import re
          import zlib
          text = Path("/tmp/mcom.txt").read_text(encoding="utf-8", errors="replace")
          lines = text.splitlines()
          searchable = re.sub(r"\s+", " ", text)
          def count(needle):
              return searchable.count(needle)
          absent = ["Y-a xis-glue", "zeno.23120540", "dd fb2642"]
          present = [
              "ddfb2642",
              "conductor_86",
              "records the general Beal",
              "792b3f8",
              "Claim-to-source distinction",
              "Y-axis-glue",
              "10.5281/zenodo.23120540",
               "Three Gap Props",
               "conductor_86 and level_lowering_86 stay Props",
               "A^4 + B^4 = (B+3)^13",
               "three research axioms distinct",
               "NOT proved conductor-equals-26",
               "research plan with proof requirements",
               "Overcoming Mathlib Gaps",
               "No prize claim is made",
          ]
          failed = False
          for needle in absent:
              n = count(needle)
              print(f"{n}\tABSENT\t{needle}")
              if n != 0:
                  failed = True
          for needle in present:
              n = count(needle)
              print(f"{n}\tPRESENT\t{needle}")
              if n < 1:
                  failed = True
          data = Path("paper/mcom-draft.pdf").read_bytes()
          blobs = [data]
          for match in re.finditer(br"stream\r?\n", data):
              start = match.end()
              end = data.find(b"endstream", start)
              raw = data[start:end]
              if raw.endswith(b"\r\n"):
                  raw = raw[:-2]
              elif raw.endswith(b"\n"):
                  raw = raw[:-1]
              try:
                  blobs.append(zlib.decompress(raw))
              except zlib.error:
                  continue
          borders = []
          for blob in blobs:
              borders.extend(re.findall(br"/Border\s*\[\s*([0-9. ]+)\]", blob))
          print(f"borders={len(borders)}")
          if not borders:
              failed = True
          for blob in blobs:
               for style in re.findall(br"/BS\s*<<(.*?)>>", blob, re.S):
                   for width in re.findall(br"/W\s+(-?[0-9.]+)", style):
                       if float(width) != 0:
                           failed = True
          for raw in borders:
              if raw.split() != [b"0", b"0", b"0"]:
                  print("nonzero border", raw)
                  failed = True
          if failed:
              raise SystemExit(1)
          PY

      - name: Upload mcom-draft.pdf
        uses: actions/upload-artifact@v4
        with:
          name: mcom-draft.pdf
          path: paper/mcom-draft.pdf
          if-no-files-found: error
