name: Lean CI — Siegel zero-free elementary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # This job is the only required status check on main. The ensemble-link
    # and bridge-notification workflows remain advisory and must not become
    # merge blockers.
    name: "Clean lake build — Siegel.SiegelZeroFreeElementary"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Verify GitHub Actions workflow allowlist
        # API workflows belong in the separate ZeroBeacon repository.
        run: bash scripts/check_workflow_allowlist.sh

      - name: Test workflow boundary guard
        run: bash scripts/test_workflow_allowlist.sh

      - name: Validate main branch protection contract
        run: python3 scripts/check_main_branch_protection_contract.py

      - name: Verify Lean and Mathlib toolchain pins
        # Fail before elan or Mathlib cache work if the repository metadata drifts.
        run: bash scripts/check-lean-toolchain.sh lean-toolchain lake-manifest.json lakefile.lean

      - name: Install elan
        run: |
          TOOLCHAIN="$(tr -d '[:space:]' < lean-toolchain)"
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -sSf | sh -s -- -y --default-toolchain "$TOOLCHAIN"
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
          restore-keys: elan-${{ runner.os }}-

      - name: Get Mathlib olean cache
        # Use prebuilt Mathlib oleans (required — building Mathlib from scratch takes hours).
        # Project-level .olean files are intentionally NOT cached so every run is a clean
        # compile of the Siegel modules, revealing any fresh-build incompatibility.
        run: lake exe cache get

      - name: lake build Siegel.SiegelZeroFreeElementary
        # Builds only the configured Siegel target; failures name the exact module.
        run: lake build Siegel.SiegelZeroFreeElementary

      - name: Check zero sorry in Siegel/
        run: |
          FOUND=$(grep -rn --include='*.lean' 'sorry' Siegel/ 2>/dev/null \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(--|/[-!*])' \
            | grep -E ':[[:space:]]*(sorry[[:space:]]*$|:= *sorry|by +sorry|<;> *sorry|exact +sorry|apply +sorry|refine.*sorry)' \
            || true)
          if [ -n "$FOUND" ]; then
            echo "FAIL: sorry tactic found in Siegel/:"
            echo "$FOUND"
            exit 1
          fi
          echo "PASS: no sorry tactic in Siegel/ proof code"
