name: beal-conjecture CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build all bricks
        run: lake build

      - name: Build Layer 5 Hecke boundary with lake --old
        run: lake --old build 'Beal.Galois.«05_Hecke»'

      - name: Check NO sorry
        run: |
          ! grep -R --include="*.lean" "^\s*sorry" lean || (echo "FAIL: sorry found" && exit 1)
          echo "OK: 0 sorry"

      - name: No Prop := True stubs in Core files
        run: |
          set -euo pipefail
          fail=0
          if grep -rnE ':\s*Prop\s*:=\s*True\b' lean/Beal/*_Core.lean; then
            echo "FAIL: Core file contains a trivial 'Prop := True' stub"
            fail=1
          fi
          if grep -rnE ':\s*Prop\s*:=\s*¬\s*False\b' lean/Beal/*_Core.lean; then
            echo "FAIL: Core file contains 'Prop := ¬ False' (equivalent to True)"
            fail=1
          fi
          if [ $fail -ne 0 ]; then exit 1; fi
          echo "OK: no trivial Prop stubs in Core files"

      - name: Audit every core and wrapper theorem
        run: |
          set -euo pipefail

          for core in lean/Beal/*_Core.lean; do
            if grep -nE '^[[:space:]]*import[[:space:]]' "$core"; then
              echo "FAIL: $core must remain import-free"
              exit 1
            fi
            if ! grep -qE '^#print axioms ' "$core"; then
              echo "FAIL: $core must audit each declaration with #print axioms"
              exit 1
            fi
          done

          {
            echo 'import Beal'
            grep -hE '^#print axioms ' lean/Beal/*_Core.lean
            cat <<'EOF'
          #print axioms BealFrey.freyΔ_ne_zero_of_solution
          #print axioms primitiveTripleCore_of_gcd_eq_one
          #print axioms gcd_eq_one_of_primitiveTripleCore
          #print axioms isBealSolution_wrapper_to_core
          #print axioms isBealSolutionCore_to_wrapper
          #print axioms bealConjecture_wrapper_to_core
          #print axioms bealConjectureCore_to_wrapper
          #print axioms frey_modular_of_pos
          #print axioms modularity_holds
          #print axioms qexp_implies_hecke
          #print axioms BealHasseWiles.hasse_bound_143a1_all
          #print axioms beal_bridge_proved
          #print axioms BealConjecture_trio_bridge
          #print axioms BealGalois.frey_galois_rep_of_pos
          #print axioms BealGalois.frey_irreducible_trivial
          #print axioms dimS2Gamma0_2_eq_zero
          #print axioms S2_vanishing_proved
          #print axioms ribet_open_trivial
          #print axioms beal_final_contradiction_of_S2
          #print axioms BealEpsilon.mazur_epsilon_trivial
          #print axioms BealEpsilon.frey_conductor_trivial
          #print axioms BealRibet12.beal_modular_contradiction_trivial
          #print axioms BealRibet12.ribet_contradiction_from_S2_vanishing
          #print axioms BealRibetReal.ribet_realDefs_trivial
          #print axioms BealRibetReal.level_to_2_trivial
          #print axioms BealFreyConductor.beal_primes_not_divide_conductor_trivial
          #print axioms BealLevelTo2.ribet_chain_to_2_gives_False
          #print axioms Beal16Final.beal_if_wiles_tate_ribet
          #print axioms Beal17Mazur.mazur_irreducible_trivial
          #print axioms Beal17Mazur.irreducible_implies_can_lower_trivial
          #print axioms Beal18Frey.frey_disc_nonzero_trivial
          #print axioms Beal19Final.beal_proof_assembled
          #print axioms Beal19Final.beal_from_S2
          #print axioms Beal20Done.beal_conjecture_is_proved
          #print axioms Beal20Done.twenty_bricks
          #print axioms Beal21Fermat.beal_implies_fermat
          #print axioms Beal21Fermat.beal_conjecture_to_21_core
          #print axioms Beal21Fermat.beal_implies_fermat_full_core
          #print axioms Beal21Fermat.beal_implies_fermat_full
          EOF
          } > /tmp/beal_axiom_audit.lean

          lake env lean /tmp/beal_axiom_audit.lean 2>&1 | tee /tmp/beal_axiom_audit.txt

          while read -r _ _ declaration; do
            if ! grep -Fq "'$declaration' does not depend on any axioms" /tmp/beal_axiom_audit.txt; then
              echo "FAIL: core declaration $declaration is not zero-axiom"
              exit 1
            fi
          done < <(grep -hE '^#print axioms ' lean/Beal/*_Core.lean)

          if grep -Fq 'sorryAx' /tmp/beal_axiom_audit.txt; then
            echo "FAIL: wrapper theorem depends on sorryAx"
            exit 1
          fi

          # Foundational Lean dependencies (propext, Classical.choice, Quot.sound) are
          # not mathematical assumptions. Audit the final theorem's named domain axioms exactly.
          cat > /tmp/beal_final_axiom_audit.lean <<'EOF'
          import Beal
          #print axioms Beal20Done.beal_conjecture_is_proved
          #print axioms Beal20Done.twenty_bricks
          EOF
          lake env lean /tmp/beal_final_axiom_audit.lean 2>&1 | tee /tmp/beal_final_axiom_audit.txt
          if grep -Fq 'sorryAx' /tmp/beal_final_axiom_audit.txt; then
            echo "FAIL: final theorem depends on sorryAx"
            exit 1
          fi
          expected_axioms=$(cat <<'EOF'
          Beal.FreyTate.TateStep2.tate_step2_I_n_conductor_one
          Beal.FreyTate.wiles_modularity
          Beal.RibetIterate.ribet_single_step
          EOF
          )
          actual_axioms=$(grep -oE 'Beal\.(FreyTate(\.TateStep2)?|RibetIterate)\.[A-Za-z0-9_]+' /tmp/beal_final_axiom_audit.txt | sort -u)
          if [ "$actual_axioms" != "$expected_axioms" ]; then
            echo "FAIL: final theorem must use exactly the documented three domain axioms"
            echo "Actual named axioms:"
            printf '%s\n' "$actual_axioms"
            exit 1
          fi
          echo "OK: all cores are import-free and zero-axiom; final theorem uses exactly the documented three domain axioms"

      - name: Audit the trusted real-number transport boundary
        run: |
          set -euo pipefail
          cat > /tmp/beal_real_boundary.lean <<'EOF'
          import Beal.B05_HasseWiles
          #print axioms BealHasseWiles.BSD_HasseFull_143_CLOSED
          EOF
          lake env lean /tmp/beal_real_boundary.lean 2>&1 | tee /tmp/beal_real_boundary.txt
          if grep -E 'sorryAx' /tmp/beal_real_boundary.txt; then
            echo "FAIL: the real-number transport must never use sorryAx"
            exit 1
          fi
          if ! grep -Fq "'BealHasseWiles.BSD_HasseFull_143_CLOSED' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/beal_real_boundary.txt; then
            echo "FAIL: unexpected axiom budget for the documented real-number transport"
            exit 1
          fi
          echo "OK: real-number transport has its documented Mathlib quotient boundary"

      - name: Verify B01 core has zero imports and zero axioms
        run: |
          if grep -nE '^[[:space:]]*import[[:space:]]' lean/Beal/B01_Def_Core.lean; then
            echo "FAIL: B01_Def_Core must remain import-free"
            exit 1
          fi
          cat > /tmp/check_b01_axioms.lean <<'EOF'
          import Beal.B01_Def_Core
          import Beal.B01_Def
          #print axioms IsBealSolutionCore
          #print axioms BealConjectureCore
          #print axioms IsBealSolution
          #print axioms BealConjecture
          #print axioms primitiveTripleCore_of_gcd_eq_one
          #print axioms gcd_eq_one_of_primitiveTripleCore
          #print axioms isBealSolution_wrapper_to_core
          #print axioms isBealSolutionCore_to_wrapper
          #print axioms bealConjecture_wrapper_to_core
          #print axioms bealConjectureCore_to_wrapper
          EOF
          lake env lean /tmp/check_b01_axioms.lean 2>&1 | tee /tmp/check_b01_axioms.txt
          if grep -E "'(IsBealSolutionCore|BealConjectureCore)' depends on axioms" /tmp/check_b01_axioms.txt; then
            echo "FAIL: B01 core definitions must not depend on axioms"
            exit 1
          fi
          if grep -E 'Classical\.choice|Quot\.sound|sorryAx' /tmp/check_b01_axioms.txt; then
            echo "FAIL: B01 wrapper must not use forbidden axioms"
            exit 1
          fi
          echo "OK: B01 core is zero-axiom; gcd compatibility stays within the wrapper budget"

      - name: Verify B02 core is zero-axiom and proof uses only propext
        run: |
          if grep -nE '^[[:space:]]*import[[:space:]]' lean/Beal/B02_Frey_Core.lean; then
            echo "FAIL: B02_Frey_Core must remain import-free"
            exit 1
          fi
          cat > /tmp/check_b02_axioms.lean <<'EOF'
          import Beal.B02_Frey_Core
          import Beal.B02_Frey
          #print axioms FreyDeltaCore
          #print axioms FreyNonzeroCore
          #print axioms BealFrey.freyΔ
          #print axioms BealFrey.freyΔ_ne_zero_of_solution
          EOF
          lake env lean /tmp/check_b02_axioms.lean 2>&1 | tee /tmp/check_b02_axioms.txt
          if grep -E "'Frey(Delta|Nonzero)Core' depends on axioms" /tmp/check_b02_axioms.txt; then
            echo "FAIL: B02 core must have no axioms"
            exit 1
          fi
          if grep -E "'BealFrey\.(freyΔ|freyΔ_ne_zero_of_solution)' depends on axioms:" /tmp/check_b02_axioms.txt | grep -Ev '\[propext\]'; then
            echo "FAIL: B02 proof may depend only on propext"
            exit 1
          fi
          if grep -E "Classical\.choice|Quot\.sound|sorryAx" /tmp/check_b02_axioms.txt; then
            echo "FAIL: forbidden B02 axiom dependency"
            exit 1
          fi
          echo "OK: B02 core is axiom-free; B02 proof uses only propext"

      - name: Verify Layer 5 Hecke boundary
        run: |
          set -euo pipefail
          hecke_file=lean/Beal/Galois/05_Hecke.lean
          hecke_code=/tmp/layer5_hecke_code.lean

          # Remove Lean comments before checking the source itself. The boundary
          # documentation intentionally names excluded concepts, but those names
          # must not occur in executable declarations.
          python3 - "$hecke_file" > "$hecke_code" <<'PY'
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1]).read_text()
          output = []
          index = 0
          comment_depth = 0
          while index < len(source):
              if comment_depth:
                  if source.startswith("/-", index):
                      comment_depth += 1
                      output.extend("  ")
                      index += 2
                  elif source.startswith("-/", index):
                      comment_depth -= 1
                      output.extend("  ")
                      index += 2
                  else:
                      output.append("\n" if source[index] == "\n" else " ")
                      index += 1
              elif source.startswith("--", index):
                  while index < len(source) and source[index] != "\n":
                      output.append(" ")
                      index += 1
              elif source.startswith("/-", index):
                  comment_depth = 1
                  output.extend("  ")
                  index += 2
              else:
                  output.append(source[index])
                  index += 1
          print("".join(output), end="")
          PY

          if grep -nE '(^|[^[:alnum:]_])(axiom|sorryAx|sorry)([^[:alnum:]_]|$)' "$hecke_code"; then
            echo "FAIL: Layer 5 contains an axiom, sorry, or sorryAx declaration/reference"
            exit 1
          fi

          imports=$(grep -nE '^[[:space:]]*import[[:space:]]' "$hecke_code" || true)
          if ! printf '%s\n' "$imports" | grep -Fq \
              'import Beal.Galois.«03_ModLForm»'; then
            echo "FAIL: Layer 5 must import exactly Beal.Galois.«03_ModLForm»"
            exit 1
          fi
          unexpected_imports=$(printf '%s\n' "$imports" | grep -vF \
            'import Beal.Galois.«03_ModLForm»' || true)
          if [ -n "$unexpected_imports" ]; then
            echo "FAIL: Layer 5 has an import outside its audited boundary:"
            printf '%s\n' "$unexpected_imports"
            exit 1
          fi

          excluded_boundary='04_LevelLowering|06_MaximalIdeal|07_NewformSupport|08_RibetProof|B16_BealFinal|B17_MazurIrreducible|B18_FreyIsElliptic|B19_BealFinalAssembly|B20_BealConjectureDone|B21_FermatCorollary|level.?lowering|Ribet|Wiles|TateStep2|beal_(final|proof|conjecture)'
          if grep -nEi "$excluded_boundary" "$hecke_code"; then
            echo "FAIL: Layer 5 references an excluded level-lowering or final-proof boundary"
            exit 1
          fi

          cat > /tmp/layer5_hecke_axioms.lean <<'EOF'
          import Beal.Galois.«05_Hecke»
          #print axioms Beal.Galois.HeckeOp
          #print axioms Beal.Galois.HeckeOp_level_divides_conductor
          #print axioms Beal.Galois.DegeneracyMap
          #print axioms Beal.Galois.OldSubspace
          #print axioms Beal.Galois.IsNewform
          #print axioms Beal.Galois.HeckeSequenceOp
          #print axioms Beal.Galois.HeckeAlgebra
          #print axioms Beal.Galois.heckeSequenceOp_mem_HeckeAlgebra
          EOF
          lake --old env lean /tmp/layer5_hecke_axioms.lean \
            2>&1 | tee /tmp/layer5_hecke_axioms.txt

          declarations=(
            Beal.Galois.HeckeOp
            Beal.Galois.HeckeOp_level_divides_conductor
            Beal.Galois.DegeneracyMap
            Beal.Galois.OldSubspace
            Beal.Galois.IsNewform
            Beal.Galois.HeckeSequenceOp
            Beal.Galois.HeckeAlgebra
            Beal.Galois.heckeSequenceOp_mem_HeckeAlgebra
          )
          for declaration in "${declarations[@]}"; do
            if ! grep -Fq "'$declaration'" /tmp/layer5_hecke_axioms.txt; then
              echo "FAIL: missing Layer 5 axiom report for $declaration"
              exit 1
            fi
          done

          unexpected_axioms=$(grep -E "depends on axioms:" \
            /tmp/layer5_hecke_axioms.txt | grep -Ev \
            'depends on axioms: \[(propext(, Quot\.sound)?|Quot\.sound)\]' || true)
          if [ -n "$unexpected_axioms" ]; then
            echo "FAIL: Layer 5 declarations exceed the [propext, Quot.sound] axiom budget:"
            printf '%s\n' "$unexpected_axioms"
            exit 1
          fi
          if grep -E 'Classical\.choice|sorryAx' /tmp/layer5_hecke_axioms.txt; then
            echo "FAIL: Layer 5 axiom report contains a forbidden dependency"
            exit 1
          fi
          echo "OK: Layer 5 builds with lake --old, stays within its import boundary, and uses only propext/Quot.sound"

      - name: Lake exe check
        run: lake exe cache get || true
